<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Песочница YoptaScript</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <h1>Песочница YoptaScript</h1>
  <p>Код выполняется в браузере через WebAssembly. Файловая система, сеть и процесс недоступны.</p>
</header>

<main>
  <section class="panel">
    <div class="bar">
      <label for="examples">Пример:</label>
      <select id="examples"></select>
      <button id="run" type="button" disabled>Запустить</button>
      <span id="status">Загрузка модуля…</span>
    </div>
    <textarea id="source" spellcheck="false" rows="18"></textarea>
  </section>

  <section class="panel">
    <h2>Вывод</h2>
    <pre id="output"></pre>
  </section>
</main>

<script type="module" src="./playground.js"></script>
</body>
</html>
